<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found — Michelle Forgacs</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#faf2f0">
<!-- GitHub Pages serves this file at whatever path was requested: every asset path is root-absolute. -->
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="apple-touch-icon" href="/favicon-180.png">
<link rel="preload" href="/fonts/playfair-700.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fonts/plexmono-500.woff2" as="font" type="font/woff2" crossorigin>
<style>
/* Page not found — the logotype's construction with other words. Tokens as in card/index.html. */
@font-face{font-family:"Playfair Display";font-style:normal;font-weight:700;font-display:swap;src:url(/fonts/playfair-700.woff2) format("woff2")}
@font-face{font-family:"IBM Plex Mono";font-style:normal;font-weight:400;font-display:swap;src:url(/fonts/plexmono-400.woff2) format("woff2")}
@font-face{font-family:"IBM Plex Mono";font-style:normal;font-weight:500;font-display:swap;src:url(/fonts/plexmono-500.woff2) format("woff2")}

:root{
  --bg:   #faf2f0;   /* the site's pink */
  --ink:  #000;      /* logotype */
  --text: #0a1a2b;   /* the site's heading ink */
  --red:  #e02b20;   /* the dot */

  --logo: "Playfair Display", Georgia, "Times New Roman", serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;

  --gutter: clamp(1.5rem, 7vw, 7rem);
  /* same scale as the card's logotype */
  --logo-size: min(calc((100vw - 2 * var(--gutter)) / 8.3), 24vh);
  /* the card has a contact row (margin .5em + line 1.5em of its size) below the profession;
     lifting by that amount puts "Page not found." exactly where the logotype sits, so the redirect swaps in place */
  --contact-size: clamp(.88rem, .35vw + .78rem, 1.05rem);
  --lift: calc(2 * var(--contact-size));
}

*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;height:100%}
html{background:var(--bg);color:var(--text);-webkit-text-size-adjust:100%;text-rendering:optimizeLegibility}
body{font:500 1rem/1.5 var(--mono)}
::selection{background:var(--ink);color:var(--bg)}

.page{
  min-height:100vh;
  min-height:100svh;
  display:grid;
  align-content:end;
  padding:var(--gutter);
  padding-bottom:calc(max(var(--gutter), 19vh) + var(--lift));
}

/* "Page not found" + the logo's dot as the full stop (same geometry as the card's logotype). */
.title{
  margin:0;
  font:700 var(--logo-size)/.94 var(--logo);
  letter-spacing:0;
  color:var(--ink);
  white-space:nowrap;
  font-kerning:normal;
}
.title__last::after{
  content:"";
  display:inline-block;
  width:.358em;
  height:.358em;
  margin-left:.0025em;
  border-radius:50%;
  background:var(--red);
  vertical-align:-.015em;
}

/* Same voice as the card's profession line. */
.redirect{
  margin:clamp(1.1rem, 1.6vw + .4rem, 2.1rem) 0 0;
  font-size:clamp(.74rem, .55vw + .52rem, 1rem);
  letter-spacing:.14em;
  text-transform:uppercase;
  color:var(--text);
}
/* no-JS fallback: styled like the card's links (red, no underline, opacity on hover) */
.redirect a{font-weight:400;font-size:var(--contact-size);letter-spacing:0;text-transform:none;color:var(--red);text-decoration:none;transition:opacity .2s cubic-bezier(.16,1,.3,1)}
.redirect a:hover{opacity:.7}
.redirect a:focus-visible{outline:2px solid var(--text);outline-offset:4px;border-radius:1px}
.count{font-variant-numeric:tabular-nums}

.sr{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}

@media (max-width:720px){
  :root{--logo-size:min(calc((100vw - 2 * var(--gutter)) / 4.4), 17vh)}
  .title span{display:block}
  .page{padding-bottom:calc(max(var(--gutter), 14vh) + var(--lift))}
}
@media (max-width:420px){
  .redirect{letter-spacing:.08em;text-wrap:balance}
}
</style>
</head>
<body>
<!--
THESIS: A transition page, not a destination. It tells the visitor that the link is gone in the logotype's own grammar, then hands them to the card.
OWN-WORLD: The card's world. Pink #faf2f0, black Playfair Display 700 with the logo's #e02b20 dot as the full stop, IBM Plex Mono voice in #0a1a2b.
STORY: The visitor reads "Page not found." and the countdown, and five seconds later is on the card.
FIRST VIEWPORT: "Page not found." at the card's logotype scale, left-aligned on the lower optical third ("Page not / found." on narrow screens). Below it, one tracked mono line with the countdown.
FORM: Extension of the business card (user-specified composition). No concept roll. Seed key: user-pinned.
FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, and DESIGN.md
-->
<main class="page">
  <h1 class="title"><span>Page not</span> <span class="title__last">found</span></h1>
  <p class="redirect" id="redirect"><a href="/">Go to the homepage</a></p>
  <p class="sr" role="status" id="status"></p>
</main>
<script>
(function () {
  var left = 5, line = document.getElementById('redirect'), status = document.getElementById('status');
  line.innerHTML = 'Redirecting to the homepage in <span class="count" id="count">' + left + '</span>…';
  var count = document.getElementById('count');
  // announced once (not every second), after the live region exists
  setTimeout(function () { status.textContent = 'Redirecting to the homepage in 5 seconds.'; }, 100);
  var timer = setInterval(function () {
    left -= 1;
    if (left > 0) { count.textContent = left; return; }
    clearInterval(timer);
    location.replace('/');   // replace: Back does not return to the 404
  }, 1000);
})();
</script>
</body>
</html>
